<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Violet Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0721" />
      <stop offset="50%" stop-color="#190e42" />
      <stop offset="100%" stop-color="#2c1266" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Speed Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Inner Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#4c1d95" stroke-width="6" />

  <!-- Outer Neon Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Speed Motion Trails -->
  <path d="M 80 210 L 170 210" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M 60 256 L 150 256" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" opacity="0.9" />
  <path d="M 90 302 L 180 302" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" opacity="0.7" />

  <!-- Center Emblem: Delivery Rider Helmet & Bakery Crown -->
  <g filter="url(#glow)">
    <!-- Helmet Base / Delivery Box Shield -->
    <path d="M 200 150 C 200 120, 312 120, 312 150 L 370 240 C 390 270, 380 320, 340 350 L 312 370 L 200 370 L 172 350 C 132 320, 122 270, 142 240 Z" fill="url(#emeraldGrad)" />

    <!-- Helmet Visor / Speed Glass Window -->
    <path d="M 210 220 C 210 190, 302 190, 302 220 L 330 280 L 182 280 Z" fill="#0b0f2a" stroke="#38bdf8" stroke-width="6" />

    <!-- Bakery Croissant / Speed Wing Crest on Top -->
    <path d="M 256 100 C 220 120, 200 150, 256 165 C 312 150, 292 120, 256 100 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="4" />

    <!-- Flash Lightning Accent inside Visor -->
    <polygon points="266,215 240,250 258,250 246,285 272,250 254,250" fill="#facc15" />
  </g>

  <!-- App Title Label 'BROOMIES RIDER' -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">BROOMIES</text>
  <text x="256" y="470" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="8">RIDER</text>
</svg>
